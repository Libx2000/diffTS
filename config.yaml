project:
  seed: 42
  artifacts_dir: ./artifacts
  runs_dir: ./runs

data:
  # Change only this path before running.
  root: /path/to/reanalysis_31year
  temperature_dir: thetao_glor_1.5deg
  salinity_dir: so_glor_1.5deg
  temperature_var: thetao
  salinity_var: so
  file_pattern_temperature: thetao_glor_{year}_0_1.5deg.nc
  file_pattern_salinity: so_glor_{year}_0_1.5deg.nc
  expected_depth_levels: 15
  history_days: 2
  lead_days: [1, 3, 5, 7, 10]
  train_years: [1993, 2017]
  val_years: [2018, 2018]
  test_years: [2019, 2020]
  ood_years: [2021, 2023]
  time_chunk: 16
  max_open_years: 3

stage1:
  qc_mode: full
  sample_days_per_year: 12
  create_monthly_climatology: true

model:
  base_channels: 12
  levels: 3
  dropout: 0.05

training:
  epochs: 40
  batch_size: 1
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_loss_weight: 0.05
  grad_clip_norm: 1.0
  amp: true
  early_stopping_patience: 8

evaluation:
  batch_size: 1
  num_workers: 4

stage3:
  deterministic_checkpoint: ./runs/deterministic/best.pt
  residual_stats: ./artifacts/stage3_residual_stats.npz
  run_name: residual_diffusion
  diffusion_steps: 1000
  beta_schedule: cosine
  base_channels: 16
  levels: 3
  dropout: 0.05
  time_embedding_dim: 128
  epochs: 50
  batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  gradient_accumulation: 2
  amp: true
  ema_decay: 0.9999
  early_stopping_patience: 10
  ensemble_members: 10
  ddim_steps: 50
  ddim_eta: 1.0
  evaluation_max_samples: 0
  calibration_min_scale: 0.25
  calibration_max_scale: 4.0
  calibration_min_blend: 0.0
  calibration_max_blend: 1.0

stage4:
  deterministic_checkpoint: ./runs/deterministic/best.pt
  stage3_checkpoint: ./runs/residual_diffusion/best.pt
  baseline_calibration: ./runs/residual_diffusion_physics_v2/validation_physics_calibration.npz
  residual_stats: ./artifacts/stage3_residual_stats.npz
  run_name: stage4_strong_baseline_correction
  train_years: [1993, 2015]
  validation_years: [2016, 2018]
  base_channels: 8
  levels: 2
  dropout: 0.05
  max_temperature_correction_c: 0.04
  max_salinity_correction_psu: 0.008
  epochs: 30
  batch_size: 1
  num_workers: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  early_stopping_patience: 7
  mse_weight: 1.0
  degradation_weight: 2.0
  degradation_margin: 0.0
  anchor_weight: 0.05
  density_weight: 0.002
  density_degradation_weight: 0.01
  gradient_weight: 0.002
  gradient_degradation_weight: 0.01
  instability_weight: 0.001
  density_scale: 0.1
  gradient_scale: 0.001
  max_validation_mse_degradation: 0.005
  selection_density_weight: 0.001
  selection_gradient_weight: 0.002
  selection_instability_weight: 0.001
  diffusion_steps: 1000
  beta_schedule: cosine
  stage3_base_channels: 16
  stage3_levels: 3
  stage3_dropout: 0.05
  stage3_time_embedding_dim: 128
  ensemble_members: 10
  ddim_steps: 50
  ddim_eta: 1.0
  evaluation_max_samples: 0

stage5:
  deterministic_checkpoint: ./runs/deterministic/best.pt
  stage3_checkpoint: ./runs/residual_diffusion/best.pt
  stage4_checkpoint: ./runs/stage4_strong_baseline_correction/best.pt
  baseline_calibration: ./runs/residual_diffusion_physics_v2/validation_physics_calibration.npz
  residual_stats: ./artifacts/stage3_residual_stats.npz
  run_name: stage5_paper_evaluation
  correction_base_channels: 8
  correction_levels: 2
  correction_dropout: 0.05
  correction_bounds: [0.04, 0.008]
  stage3_base_channels: 16
  stage3_levels: 3
  stage3_dropout: 0.05
  stage3_time_embedding_dim: 128
  diffusion_steps: 1000
  beta_schedule: cosine
  ensemble_members: 10
  ddim_steps: 50
  ddim_eta: 1.0
  num_workers: 4
  evaluation_max_samples: 0
  ablation_alphas: [0.0, 0.5, 1.0]
  bootstrap_replicates: 2000
  crps_noninferiority_margin_percent: 0.5
